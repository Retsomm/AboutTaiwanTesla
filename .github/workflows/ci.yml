name: Verify
on:
  push:
    branches: [main]
    paths-ignore: ['data/raw/**', 'public/data/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test:python
      - run: yarn test
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      - run: yarn exec playwright install --with-deps chromium
      - run: yarn test:e2e
